name: bonplein_flutter
description: "bonplein vous permet de trouver les meilleures stations service en quelques secondes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_location_marker: ^10.3.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.1.1
  json_annotation: ^4.12.0
  json_serializable: ^6.14.1
  latlong2: ^0.9.1
  retrofit: ^4.10.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  geolocator_platform_interface: ^4.4.0
  plugin_platform_interface: ^2.1.8
  retrofit_generator: ^10.2.9
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
