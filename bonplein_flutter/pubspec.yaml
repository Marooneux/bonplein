name: bonplein_flutter
description: "bonplein vous permet de trouver les meilleures stations service en quelques secondes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  json_serializable: ^6.14.1
  dio: ^5.11.1
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.0-dev.3
  retrofit_generator: ^10.2.9

flutter:
  uses-material-design: true